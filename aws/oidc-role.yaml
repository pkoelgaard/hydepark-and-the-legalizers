AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for Hyde Park and the Legalizers

Parameters:
  Repo:
    Type: String
    Default: pkoelgaard/hydepark-and-the-legalizers
    Description: GitHub repository allowed to assume the role

  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::316865757087:oidc-provider/token.actions.githubusercontent.com
    Description: Existing GitHub Actions OIDC provider ARN

Resources:
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hydepark-github-actions
      Description: Terraform deployment role for Hyde Park and the Legalizers
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${Repo}:ref:refs/heads/main
      Policies:
        - PolicyName: TerraformProduction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:RebootInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeAddresses
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeImages
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::cicd101-terraform-state/hydepark/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::cicd101-terraform-state
                Condition:
                  StringLike:
                    s3:prefix:
                      - hydepark/*

Outputs:
  RoleArn:
    Description: IAM role ARN for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn
