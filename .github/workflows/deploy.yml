name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::316865757087:role/hydepark-github-actions
  DEPLOY_BUCKET: hydepark-and-the-legalizers-deploy-316865757087

jobs:
  terraform:
    name: Terraform production
    runs-on: ubuntu-latest

    outputs:
      ec2_host: ${{ steps.tf_output.outputs.ec2_host }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config=config/backend-prod.hcl

      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan \
            -var-file=prod.tfvars

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply \
            -auto-approve \
            -var-file=prod.tfvars

      - name: Get EC2 public IP
        id: tf_output
        working-directory: infra
        run: |
          echo "ec2_host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy application
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: |
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf hydepark-deploy.tar.gz \
            app \
            infra/scripts/enable-https.sh \
            infra/systemd/hydepark.service

      - name: Upload deployment artifact to S3
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          aws s3 cp \
            hydepark-deploy.tar.gz \
            "s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}.tar.gz"

          echo "Deployment artifact uploaded:"
          echo "s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}.tar.gz"

      - name: Create remote deployment script
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cat > remote-deploy.sh <<EOF_REMOTE
          set -euo pipefail

          BUCKET="${DEPLOY_BUCKET}"
          KEY="releases/${GITHUB_SHA}.tar.gz"
          ARCHIVE="/tmp/hydepark-deploy.tar.gz"

          echo "Downloading deployment artifact..."
          aws s3 cp \
            "s3://\${BUCKET}/\${KEY}" \
            "\${ARCHIVE}" \
            --region "${AWS_REGION}"

          echo "Preparing application directories..."
          sudo mkdir -p /opt/hydepark/app
          sudo mkdir -p /opt/hydepark/scripts

          echo "Extracting deployment artifact..."
          sudo tar \
            -xzf "\${ARCHIVE}" \
            -C /opt/hydepark

          echo "Setting ownership..."
          sudo chown -R ec2-user:ec2-user /opt/hydepark

          echo "Installing Python dependencies..."
          /opt/hydepark/venv/bin/pip install --upgrade pip
          /opt/hydepark/venv/bin/pip install \
            -r /opt/hydepark/app/requirements.txt

          echo "Installing HTTPS script..."
          sudo install \
            -m 0755 \
            /opt/hydepark/infra/scripts/enable-https.sh \
            /opt/hydepark/scripts/enable-https.sh

          echo "Installing systemd service..."
          sudo install \
            -m 0644 \
            /opt/hydepark/infra/systemd/hydepark.service \
            /etc/systemd/system/hydepark.service

          echo "Reloading systemd..."
          sudo systemctl daemon-reload

          echo "Enabling application service..."
          sudo systemctl enable hydepark

          echo "Restarting application..."
          sudo systemctl restart hydepark

          echo "Checking application service..."
          sudo systemctl --no-pager --full status hydepark

          echo "Testing local application..."

          for i in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5000/ \
              > /tmp/hydepark-local-test.txt; then
              echo "Application is responding."
              break
            fi

            echo "Application not ready yet - attempt \$i/30"
            sleep 2
          done

          if ! curl --fail --silent --show-error \
            http://127.0.0.1:5000/ \
            > /tmp/hydepark-local-test.txt; then
            echo "Application failed health check."
            echo
            echo "Service status:"
            sudo systemctl --no-pager --full status hydepark || true
            echo
            echo "Recent journal:"
            sudo journalctl -u hydepark -n 50 --no-pager || true
            exit 1
          fi

          echo "Application response:"
          cat /tmp/hydepark-local-test.txt
          echo "Testing EPK endpoint..."
          if ! curl --fail --silent --show-error \
            http://127.0.0.1:5000/epk \
            > /tmp/hydepark-epk-test.txt; then
            echo "EPK endpoint failed health check."
            echo
            echo "EPK response:"
            cat /tmp/hydepark-epk-test.txt 2>/dev/null || true
            echo
            echo "Recent journal:"
            sudo journalctl -u hydepark -n 50 --no-pager || true
            exit 1
          fi
          echo "EPK endpoint OK."

          echo "Cleaning up..."
          rm -f "\${ARCHIVE}"

          echo "Deployment complete."
          EOF_REMOTE

          chmod 700 remote-deploy.sh

      - name: Send deployment command via SSM
        id: ssm
        env:
          EC2_INSTANCE_ID: i-0fca199034189d8cf
        run: |
          set -euo pipefail

          COMMANDS_JSON=$(jq -cn \
            --rawfile command remote-deploy.sh \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS_JSON" \
            --comment "Hydepark deployment ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deployment
        env:
          EC2_INSTANCE_ID: i-0fca199034189d8cf
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          echo "Waiting for SSM command to finish..."

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Attempt $i/60 - Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                echo
                echo "STDOUT:"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                echo
                echo "STDERR:"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1

      - name: Show deployment output
        env:
          EC2_INSTANCE_ID: i-0fca199034189d8cf
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "===== SSM STDOUT ====="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo
          echo "===== SSM STDERR ====="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text
